<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Noctem{% endblock %}</title>
    <style>
        /* ===== Base Layout ===== */
        body {
            background: #1f1f1f;
            margin: 0;
            color: #e8eaed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Lato, Helvetica, Arial, sans-serif;
        }
        
        .app-layout {
            display: flex;
            min-height: 100vh;
        }
        
        /* ===== Sidebar ===== */
        .app-sidebar {
            width: 220px;
            background: #1a1a1a;
            border-right: 1px solid #3c3c3c;
            padding: 1rem 0.75rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 200;
            transition: transform 0.25s ease;
        }
        
        .sidebar-brand {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e8eaed;
            padding: 0.25rem 0.5rem 1rem;
            border-bottom: 1px solid #3c3c3c;
            margin-bottom: 0.75rem;
        }
        
        .sidebar-nav { flex: 1; }
        
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #9aa0a6;
            text-decoration: none;
            padding: 0.45rem 0.5rem;
            border-radius: 6px;
            font-size: 0.82rem;
            margin-bottom: 2px;
            transition: all 0.15s;
        }
        .sidebar-nav a:hover { background: #2d2d2d; color: #e8eaed; }
        .sidebar-nav a.active { background: #3c4043; color: #8ab4f8; }
        
        .sidebar-section {
            font-size: 0.7rem;
            color: #5f6368;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.75rem 0.5rem 0.3rem;
        }
        
        /* Sidebar footer — view toggle */
        .sidebar-footer {
            border-top: 1px solid #3c3c3c;
            padding-top: 0.75rem;
            margin-top: auto;
        }
        .view-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.3rem 0.5rem;
            font-size: 0.75rem;
            color: #9aa0a6;
        }
        .view-toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
            background: #3c4043;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .view-toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #9aa0a6;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .view-toggle-switch.on { background: #8ab4f8; }
        .view-toggle-switch.on::after { transform: translateX(16px); background: #1f1f1f; }
        
        /* ===== Hamburger (mobile) ===== */
        .hamburger {
            display: none;
            position: fixed;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 300;
            background: #2d2d2d;
            border: 1px solid #3c3c3c;
            color: #e8eaed;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
        }
        
        /* ===== Main content ===== */
        .app-main {
            flex: 1;
            overflow-y: auto;
            background: #1f1f1f;
        }
        
        /* ===== Mobile responsive ===== */
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            
            .app-sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
            }
            .app-sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            
            .app-main { padding-top: 3.5rem; /* space for hamburger */ }
        }
        
        /* ===== Force mobile mode (toggle override) ===== */
        body.force-mobile .hamburger { display: flex; }
        body.force-mobile .app-sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            transform: translateX(-100%);
        }
        body.force-mobile .app-sidebar.open { transform: translateX(0); }
        body.force-mobile .sidebar-overlay.open { display: block; }
        body.force-mobile .app-main { padding-top: 3.5rem; }
        
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <!-- Hamburger button (visible on mobile) -->
    <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()">☰</button>
    
    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="app-sidebar" id="appSidebar">
            <div class="sidebar-brand">🌙 Noctem</div>
            
            <div class="sidebar-nav">
                <div class="sidebar-section">Views</div>
                <a href="/" class="{% if request.path == '/' %}active{% endif %}">📊 Dashboard</a>
                <a href="/graph" class="{% if '/graph' in request.path %}active{% endif %}">🕸️ Graph</a>
                <a href="/calendar/view" class="{% if '/calendar/view' in request.path %}active{% endif %}">📅 Calendar</a>
                <a href="/tasks/upcoming" class="{% if '/tasks/upcoming' in request.path %}active{% endif %}">📋 Upcoming</a>
                <a href="/tasks/projects" class="{% if '/tasks/projects' in request.path %}active{% endif %}">📁 Projects</a>
                
                <div class="sidebar-section">Tools</div>
                <a href="/control" class="{% if '/control' in request.path %}active{% endif %}">🎛️ Control</a>
                <a href="/feedback" class="{% if '/feedback' in request.path %}active{% endif %}">📝 Feedback</a>
                <a href="/voice" class="{% if '/voice' in request.path %}active{% endif %}">🎤 Voice</a>
                
                <div class="sidebar-section">System</div>
                <a href="/settings#calendar-import" class="{% if request.path == '/calendar' or '/settings' in request.path %}active{% endif %}">📥 Calendar Import</a>
                <a href="/settings" class="{% if '/settings' in request.path %}active{% endif %}">🔧 Settings</a>
            </div>
            
            <div class="sidebar-footer">
                <div class="view-toggle">
                    <span>Mobile view</span>
                    <div class="view-toggle-switch" id="viewToggle" onclick="toggleViewMode()"></div>
                </div>
            </div>
        </nav>
        
        <!-- Main content area -->
        <div class="app-main" id="appMain">
            {% block content %}{% endblock %}
        </div>
    </div>
    
    <script>
        // ===== Sidebar toggle (mobile) =====
        function toggleSidebar() {
            document.getElementById('appSidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('open');
        }
        function closeSidebar() {
            document.getElementById('appSidebar').classList.remove('open');
            document.getElementById('sidebarOverlay').classList.remove('open');
        }
        
        // ===== Desktop/Mobile view toggle =====
        const VIEW_MODE_KEY = 'noctem_view_mode'; // 'auto', 'mobile', 'desktop'
        
        function getViewMode() {
            return localStorage.getItem(VIEW_MODE_KEY) || 'auto';
        }
        
        function applyViewMode() {
            const mode = getViewMode();
            const toggle = document.getElementById('viewToggle');
            const body = document.body;
            
            body.classList.remove('force-mobile');
            
            if (mode === 'mobile') {
                body.classList.add('force-mobile');
                if (toggle) toggle.classList.add('on');
            } else {
                if (toggle) toggle.classList.remove('on');
            }
        }
        
        function toggleViewMode() {
            const current = getViewMode();
            const next = (current === 'mobile') ? 'auto' : 'mobile';
            localStorage.setItem(VIEW_MODE_KEY, next);
            applyViewMode();
            closeSidebar();
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', applyViewMode);
        
        // ===== Helper: escape HTML =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        {% block extra_script %}{% endblock %}
    </script>
</body>
</html>
